<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Self-Organizing System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#cfe0d6;font:12px/1.3 "Courier New",monospace;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
.hint{position:absolute;right:10px;bottom:8px;z-index:9999;color:#2d4a63;font-size:10px;letter-spacing:1px}
/* ---------- MODE A : terminals ---------- */
#modeA{position:absolute;inset:0;background:#000}
.win{position:absolute;background:#02060b;border:1px solid #27547e;box-shadow:0 0 0 1px #050a10,0 6px 20px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;transition:left .9s ease,top .9s ease,width .9s ease,height .9s ease,opacity .5s}
.win .tb{display:flex;align-items:center;gap:10px;background:#8fb8d8;color:#06101c;height:16px;padding:0 6px;font:10px/16px "Courier New",monospace;flex:0 0 auto}
.win .tb .tt{font-weight:bold;letter-spacing:.5px;margin-right:auto;overflow:hidden;white-space:nowrap}
.win .tb .mi{opacity:.8;font-size:9px}
.win .tb .bt{width:7px;height:7px;border:1px solid #06101c;margin-left:2px}
.win .bodywrap{flex:1;display:flex;min-height:0}
.win .sb{width:11px;background:#06121e;border-right:1px solid #1d3b57;position:relative;flex:0 0 auto}
.win .sb i{position:absolute;left:1px;right:1px;background:#2f6ea0;height:30px;top:6px}
.win .body{flex:1;overflow:hidden;padding:3px 5px;white-space:pre;font-size:11px;line-height:1.25}
.grn{color:#4fe08a}.wht{color:#d7e2e8}.cyn{color:#5fd0e0}.dim{color:#39566b}
.row-y{background:#b9a93a;color:#0a0a02}.row-b{background:#2f6ea0;color:#eaf3ff}
/* ---------- MODE B : blueprint ---------- */
#modeB{position:absolute;inset:0;background:#02040a;opacity:0;pointer-events:none}
#modeB svg{position:absolute;inset:0;width:100%;height:100%}
.bp{fill:none;stroke:#eaf3ff;stroke-width:1;vector-effect:non-scaling-stroke}
.bp.th{stroke-width:.6;stroke:#b9cfe6}
.bp.dim{stroke:#4f6f8c}
.glow{filter:url(#sg)}
text.spec{fill:#9fc0dd;font:7px "Courier New",monospace;letter-spacing:.3px}
text.lbl{fill:#cfe0f0;font:8px "Courier New",monospace;letter-spacing:1px}
.draw{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 2.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{animation:fade 7s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
</style><script src="../vendor/debug-cover.js?v=1.4.0"></script>
</head><body>
<div id="stage">
 <div id="modeA"></div>
 <div id="modeB">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
   <defs>
    <filter id="sg" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#eaf6ff" stop-opacity=".9"/><stop offset="60%" stop-color="#9fd0ff" stop-opacity=".35"/><stop offset="100%" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
   </defs>
   <!-- outer frame -->
   <rect class="bp th" x="24" y="24" width="1552" height="852"/>
   <rect class="bp th" x="40" y="40" width="880" height="820"/>
   <rect class="bp th" x="936" y="40" width="200" height="820"/>
   <rect class="bp th" x="1152" y="40" width="424" height="820"/>
   <g id="bpLeft"></g>
   <g id="bpMid"></g>
   <g id="bpRight"></g>
  </svg>
 </div>
 <div class="hint" id="hint">[M] TOGGLE MODE &nbsp;·&nbsp; AUTO-CYCLE</div>
</div>
<script>
const P=new URLSearchParams(location.search);
const forced=P.get('mode');
const RND=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(RND(a,b));
const pick=a=>a[RI(0,a.length)];
const hex=n=>'0x'+Array.from({length:n},()=>'0123456789ABCDEF'[RI(0,16)]).join('');

/* ===================== MODE A ===================== */
const MODULES=['kernel.sched','mem.alloc','net.route','io.flush','crypt.core','parse.ast','graph.walk','cache.lru','sync.lock','vm.page','fs.inode','proc.fork','sig.trap','dma.map','bus.arb','clk.pll'];
const STATES=['OK','BUSY','IDLE','SYNC','MOVE','WAIT','DONE'];
const modeA=document.getElementById('modeA');
let wins=[];let zTop=10;

function makeBody(type){
 if(type==='green'){let s=' PID   MODULE          ADDR        LOAD  ST\n';for(let i=0;i<RI(8,16);i++){s+=' '+String(RI(100,9999)).padStart(4)+'  '+pick(MODULES).padEnd(14)+'  '+hex(6)+'  '+String(RI(1,99)).padStart(3)+'%  '+pick(STATES)+'\n';}return {cls:'grn',text:s};}
 if(type==='white'){let cols=[];for(let c=0;c<3;c++){let col='';for(let i=0;i<RI(16,30);i++)col+=hex(4).slice(2)+' ';cols.push(col);}let s='';for(let i=0;i<RI(16,28);i++){s+=hex(4).slice(2)+' '+hex(4).slice(2)+' '+hex(4).slice(2)+' '+hex(4).slice(2)+'\n';}return {cls:'wht',text:s};}
 if(type==='console'){return {cls:'cyn',text:'> initialising sector '+hex(4)+'\n',stream:'console'};}
 if(type==='table'){let s=' NODE   LINK     WEIGHT\n';let rows=[];for(let i=0;i<RI(6,11);i++){const hl=Math.random()<.22?'row-y':(Math.random()<.22?'row-b':'');rows.push({hl,t:' '+pick(MODULES).slice(0,5).padEnd(5)+'  '+hex(3)+'  '+String(RI(1,999)).padStart(6)});}return {cls:'wht',rows:[{hl:'',t:s.trim()}].concat(rows)};}
 return {cls:'grn',text:'...\n'};
}
function spawnWin(){
 if(wins.length>9){closeWin(wins[0]);}
 const type=pick(['green','white','console','table','green','white']);
 const w=RI(180,340),h=RI(120,260);
 const el=document.createElement('div');el.className='win';
 el.style.left=RI(40,1600-w-40)+'px';el.style.top=RI(30,900-h-40)+'px';el.style.width=w+'px';el.style.height=h+'px';el.style.opacity=0;el.style.zIndex=++zTop;
 const title=pick(MODULES)+' :: '+pick(['monitor','rewrite','trace','map','daemon']);
 el.innerHTML='<div class="tb"><span class="tt">'+title+'</span><span class="mi">File</span><span class="mi">Edit</span><span class="mi">View</span><span class="bt"></span><span class="bt"></span></div>'
  +'<div class="bodywrap"><div class="sb"><i></i></div><div class="body"></div></div>';
 modeA.appendChild(el);
 const body=el.querySelector('.body');
 const data=makeBody(type);
 if(data.rows){body.innerHTML=data.rows.map(r=>'<div class="'+(r.hl||data.cls)+'">'+r.t+'</div>').join('');}
 else{body.className='body '+data.cls;body.textContent=data.text;}
 const win={el,body,type,data,sb:el.querySelector('.sb i')};
 wins.push(win);
 requestAnimationFrame(()=>{el.style.opacity=1;});
 return win;
}
function closeWin(win){if(!win)return;win.el.style.opacity=0;setTimeout(()=>win.el.remove(),500);wins=wins.filter(w=>w!==win);}
function streamWin(win){
 if(win.type==='console'){
  const lines=['Loading module... COMPLETE','> mapping '+hex(5),'> relink '+pick(MODULES),'> verify OK','Loading module... COMPLETE','> reorder table','> flush '+hex(4)];
  win.body.textContent+=pick(lines)+'\n';
 }else if(win.data.rows){
  // shuffle a highlight
  const d=win.body.querySelectorAll('div');if(d.length){d.forEach(x=>{if(x.classList.contains('row-y')||x.classList.contains('row-b')){x.className=win.data.cls;}});const t=d[RI(1,d.length)];if(t)t.className=Math.random()<.5?'row-y':'row-b';}
 }else{
  const extra=win.type==='green'?(' '+String(RI(100,9999)).padStart(4)+'  '+pick(MODULES).padEnd(14)+'  '+hex(6)+'  '+String(RI(1,99)).padStart(3)+'%  '+pick(STATES)):(hex(4).slice(2)+' '+hex(4).slice(2)+' '+hex(4).slice(2)+' '+hex(4).slice(2));
  win.body.textContent+=extra+'\n';
 }
 // trim + autoscroll via removing top lines
 const maxLines=Math.floor(win.el.clientHeight/14);
 if(win.type!=='table'){const ls=win.body.textContent.split('\n');if(ls.length>maxLines+3)win.body.textContent=ls.slice(ls.length-maxLines-2).join('\n');}
 // move scrollbar
 if(win.sb)win.sb.style.top=(6+RND(0,Math.max(6,win.el.clientHeight-50)))+'px';
}
function fidget(){
 // move/resize a random window
 if(!wins.length)return;const win=pick(wins);
 if(Math.random()<.5){const w=RI(180,360),h=RI(120,260);win.el.style.left=RI(40,1600-w-40)+'px';win.el.style.top=RI(30,900-h-40)+'px';win.el.style.width=w+'px';win.el.style.height=h+'px';}
 win.el.style.zIndex=++zTop; // raise
}
let aTimers=[];
function startA(){
 for(let i=0;i<7;i++)spawnWin();
 aTimers.push(setInterval(()=>{wins.forEach(w=>{if(Math.random()<.6)streamWin(w);});},260));
 aTimers.push(setInterval(()=>{if(Math.random()<.6)spawnWin();},2200));
 aTimers.push(setInterval(()=>{if(wins.length>4&&Math.random()<.5)closeWin(pick(wins));},3200));
 aTimers.push(setInterval(fidget,1500));
}
function stopA(){aTimers.forEach(clearInterval);aTimers=[];}

/* ===================== MODE B ===================== */
const NS='http://www.w3.org/2000/svg';
function E(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function pathLen(d){const p=E('path',{d});const svg=document.querySelector('#modeB svg');svg.appendChild(p);const l=p.getTotalLength();p.remove();return l;}
function addDraw(g,el,delay){g.appendChild(el);let l=400;try{l=el.getTotalLength();}catch(e){try{const bb=el.getBBox();l=2*(bb.width+bb.height)||400;}catch(e2){l=400;}}el.style.setProperty('--l',Math.ceil(l));el.style.animationDelay=(delay||0)+'s';el.classList.add('draw');}

function buildRadial(g,cx,cy,R,n){
 // central chip
 const chip=E('rect',{x:cx-34,y:cy-34,width:68,height:68,class:'bp'});addDraw(g,chip,.1);
 const chip2=E('rect',{x:cx-22,y:cy-22,width:44,height:44,class:'bp th'});addDraw(g,chip2,.3);
 for(let k=-18;k<=18;k+=6){g.appendChild(E('line',{x1:cx+k,y1:cy-22,x2:cx+k,y2:cy+22,class:'bp dim'}));}
 for(let k=-18;k<=18;k+=6){g.appendChild(E('line',{x1:cx-22,y1:cy+k,x2:cx+22,y2:cy+k,class:'bp dim'}));}
 // ring modules
 for(let i=0;i<n;i++){
  const a=i/n*Math.PI*2;const rx=cx+Math.cos(a)*R, ry=cy+Math.sin(a)*R;
  const spoke=E('line',{x1:cx+Math.cos(a)*44,y1:cy+Math.sin(a)*44,x2:rx,y2:ry,class:'bp th'});addDraw(g,spoke,.4+i*0.04);
  const mw=34,mh=26;
  const rc=E('rect',{x:rx-mw/2,y:ry-mh/2,width:mw,height:mh,class:'bp',transform:'rotate('+(a*180/Math.PI+90)+' '+rx+' '+ry+')'});addDraw(g,rc,.6+i*0.05);
  const rc2=E('rect',{x:rx-mw/2+4,y:ry-mh/2+4,width:mw-8,height:mh-8,class:'bp dim',transform:'rotate('+(a*180/Math.PI+90)+' '+rx+' '+ry+')'});g.appendChild(rc2);
 }
 const ring=E('circle',{cx,cy,r:R,class:'bp dim'});addDraw(g,ring,.2);
 const ring2=E('circle',{cx,cy,r:R+22,class:'bp th'});addDraw(g,ring2,.2);
}
function buildChip(g,x,y,s){
 const o=E('rect',{x,y,width:s,height:s,class:'bp'});addDraw(g,o,.2);
 const inner=E('rect',{x:x+s*.28,y:y+s*.28,width:s*.44,height:s*.44,class:'bp th'});addDraw(g,inner,.5);
 const pins=10;for(let i=0;i<pins;i++){const t=x+s*.12+i*(s*.76/(pins-1));
  g.appendChild(E('line',{x1:t,y1:y-7,x2:t,y2:y,class:'bp dim'}));
  g.appendChild(E('line',{x1:t,y1:y+s,x2:t,y2:y+s+7,class:'bp dim'}));
  g.appendChild(E('line',{x1:x-7,y1:t,x2:x,y2:t,class:'bp dim'}));
  g.appendChild(E('line',{x1:x+s,y1:t,x2:x+s+7,y2:t,class:'bp dim'}));}
}
function buildAssembly(g,x,y,w){
 g.appendChild(E('line',{x1:x,y1:y,x2:x+w,y2:y,class:'bp th'}));
 let cx=x+10;while(cx<x+w-30){const bw=RI(26,54);g.appendChild(E('rect',{x:cx,y:y-14,width:bw,height:28,class:'bp dim'}));g.appendChild(E('rect',{x:cx+3,y:y-8,width:bw-6,height:16,class:'bp dim'}));cx+=bw+RI(6,16);}
}
function buildStrip(g,x,y,w){g.appendChild(E('rect',{x,y,width:w,height:30,class:'bp dim'}));for(let i=0;i<40;i++){const bx=x+4+i*(w-8)/40;g.appendChild(E('line',{x1:bx,y1:y+4,x2:bx,y2:y+4+RND(4,24),class:'bp dim'}));}}
function specText(g,x,y,rows){for(let i=0;i<rows;i++){const t=E('text',{x,y:y+i*10,class:'spec'});t.textContent=hex(4)+'  '+pick(MODULES).toUpperCase().slice(0,6)+'  '+String(RI(0,999)).padStart(3);g.appendChild(t);}}
function buildExploded(g,cx,topY){
 // glowing stacked disc
 const gd=E('g',{class:'glow fade'});
 for(let i=0;i<5;i++){gd.appendChild(E('ellipse',{cx,cy:topY+i*10,rx:78-i*3,ry:24-i*1.5,class:'bp th'}));}
 gd.appendChild(E('ellipse',{cx,cy:topY+20,rx:60,ry:18,fill:'url(#disc)',stroke:'none'}));
 g.appendChild(gd);
 // ring top view
 const ry0=topY+150;const gr=E('g',{class:'glow'});
 gr.appendChild(E('circle',{cx,cy:ry0,r:66,class:'bp th'}));gr.appendChild(E('circle',{cx,cy:ry0,r:40,class:'bp dim'}));
 for(let i=0;i<16;i++){const a=i/16*Math.PI*2;gr.appendChild(E('rect',{x:cx+Math.cos(a)*53-6,y:ry0+Math.sin(a)*53-6,width:12,height:12,class:'bp dim',transform:'rotate('+(a*180/Math.PI)+' '+(cx+Math.cos(a)*53)+' '+(ry0+Math.sin(a)*53)+')'}));}
 g.appendChild(gr);
 // stacked layer column
 const ly=topY+250;const gl=E('g',{class:'glow fade'});
 for(let i=0;i<9;i++){const yy=ly+i*22;gl.appendChild(E('path',{d:'M'+(cx-70)+' '+yy+' L'+cx+' '+(yy-14)+' L'+(cx+70)+' '+yy+' L'+cx+' '+(yy+14)+' Z',class:'bp th'}));}
 g.appendChild(gl);
}
function buildBlueprint(){
 const L=document.getElementById('bpLeft'),M=document.getElementById('bpMid'),Rr=document.getElementById('bpRight');
 L.innerHTML='';M.innerHTML='';Rr.innerHTML='';
 // title
 const tl=E('text',{x:52,y:60,class:'lbl'});tl.textContent='ASSEMBLY SCHEMATIC // DRAFT '+String(RI(1,99)).padStart(2,'0');L.appendChild(tl);
 buildRadial(L,330,330,210,16);
 buildChip(L,620,170,150);
 buildAssembly(L,70,690,820);
 buildStrip(L,70,760,520);
 specText(L,620,420,22);
 // mid
 const tm=E('text',{x:948,y:60,class:'lbl'});tm.textContent='SPEC';M.appendChild(tm);
 specText(M,948,80,70);
 // right exploded
 const tr=E('text',{x:1164,y:60,class:'lbl'});tr.textContent='EXPLODED VIEW';Rr.appendChild(tr);
 buildExploded(Rr,1364,110);
}

/* ===================== MODE SWITCH ===================== */
let mode='A';let cycle=null;
function setMode(m){
 mode=m;
 if(m==='A'){document.getElementById('modeB').style.opacity=0;document.getElementById('modeA').style.opacity=1;if(!aTimers.length)startA();}
 else{document.getElementById('modeA').style.opacity=0;document.getElementById('modeB').style.opacity=1;buildBlueprint();}
}
function toggle(){setMode(mode==='A'?'B':'A');}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m'){if(cycle){clearInterval(cycle);cycle=null;}toggle();}});

if(forced==='b'){startA();stopA();document.getElementById('modeA').style.opacity=0;mode='B';document.getElementById('modeB').style.opacity=1;buildBlueprint();}
else if(forced==='a'){setMode('A');}
else{setMode('A');cycle=setInterval(()=>{toggle();if(mode==='B')setTimeout(()=>{if(mode==='B')buildBlueprint();},100);},16000);}
</script><div id="ui-hint" style="position:fixed;right:8px;bottom:6px;z-index:9999;font:11px/1.3 inherit;font-family:inherit;color:#9fd0ff;opacity:.55;pointer-events:none;letter-spacing:.04em">M switches code / blueprint · ?mode=a (code) or ?mode=b (blueprint)</div>
</body></html>
