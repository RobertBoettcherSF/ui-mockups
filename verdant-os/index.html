<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>VerdantOS</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#05080a;color:#7fe3e0;font:12px/1.35 "Courier New",monospace;position:relative;user-select:none}
/* desktop wallpaper */
#desk{position:absolute;inset:0;background:radial-gradient(1200px 700px at 70% 20%,#0d2a28,#05080a 70%);}
#desk:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000030 3px 4px),repeating-linear-gradient(90deg,#0000 0 3px,#00000020 3px 4px);pointer-events:none}
.deskicons{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:14px}
.di{width:76px;text-align:center;cursor:pointer;color:#9fe8e4}.di:hover{color:#d6ff3a}.di svg{width:34px;height:34px}.di span{display:block;font-size:10px;margin-top:3px}
/* windows */
.win{position:absolute;min-width:220px;min-height:140px;background:#0a1012ee;border:1px solid #1d5c5a;box-shadow:0 10px 40px #000a,0 0 0 1px #0d2a28;display:flex;flex-direction:column;z-index:10}
.win.active{border-color:#2fd6cf;box-shadow:0 12px 50px #000c,0 0 14px #2fd6cf44}
.tb{height:26px;background:linear-gradient(#0f2220,#0a1614);border-bottom:1px solid #1d5c5a;display:flex;align-items:center;gap:6px;padding:0 6px;cursor:move;letter-spacing:1px;color:#d6ff3a;font-size:11px}
.tb .ico{width:14px;height:14px}
.tb .sp{flex:1}
.tb button{width:16px;height:14px;border:1px solid #2a6b68;background:#0d1a19;color:#7fe3e0;font:9px monospace;cursor:pointer;line-height:1}
.tb button:hover{background:#1d5c5a;color:#000}
.wc{flex:1;overflow:auto;position:relative}
.pad{padding:10px}
.row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #143c3b}.v{color:#d6ff3a}
.bar{height:6px;background:#143c3b;margin:3px 0 7px}.bar i{display:block;height:100%;background:#2fd6cf}
.big{font-size:26px;color:#d6ff3a}
.haz{height:46px;margin:8px 0;background:repeating-linear-gradient(45deg,#d6ff3a 0 10px,#07090a 10px 20px);display:flex;align-items:center;justify-content:center}.haz span{background:#07090a;color:#d6ff3a;padding:3px 8px;font-weight:bold}
/* map */
.maproot{position:absolute;inset:0}.maproot .leaf{position:absolute;inset:0;background:#060a0b}
.maproot .fb{position:absolute;inset:0;display:none}.maproot .fb canvas,.maproot .fb svg{position:absolute;inset:0;width:100%;height:100%}
.maproot .fb svg{z-index:2;pointer-events:none}
.st{fill:rgba(47,214,207,.04);stroke:#cfe9e6;stroke-width:1.2}.stlbl{fill:#bfe9e6;font:11px "Courier New",monospace}.cty{fill:none;stroke:rgba(207,233,230,.25);stroke-width:.6;stroke-dasharray:3 3}
.flag{position:absolute;top:4px;left:6px;z-index:6;font-size:9px;color:#d6ff3a;background:#060a0bcc;padding:1px 5px}
.attr{position:absolute;bottom:2px;right:3px;z-index:6;font-size:8px;color:#4f8a86;background:#060a0bcc;padding:1px 4px}.attr a{color:#6fb3ae}
.leaflet-container{background:#060a0b}.radar-pane{filter:hue-rotate(-20deg) saturate(1.5) brightness(1.15)}.border-pane path{stroke:#2fd6cf;filter:drop-shadow(0 0 2px #2fd6cf88)}
/* charts */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}.charts .cp{border:1px solid #143c3b;padding:4px}.charts .h{color:#d6ff3a;font-size:10px;margin-bottom:3px}.charts canvas{width:100%;height:70px;display:block}
/* terminal */
.term{background:#030605;color:#8dffc0;font:12px/1.4 "Courier New",monospace;height:100%;padding:8px;overflow:auto}
.term .in{display:flex}.term .in span{color:#d6ff3a;margin-right:6px}.term input{flex:1;background:none;border:none;color:#8dffc0;font:inherit;outline:none}
/* taskbar */
#bar{position:absolute;left:0;right:0;bottom:0;height:40px;background:#07110fdd;border-top:1px solid #1d5c5a;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:1000;backdrop-filter:blur(3px)}
#start{display:flex;align-items:center;gap:6px;color:#d6ff3a;letter-spacing:2px;font-weight:bold;cursor:pointer;padding:0 8px}
#start svg{width:20px;height:20px}
.dock{flex:1;display:flex;gap:6px}
.dock .app{display:flex;align-items:center;gap:5px;background:#0d1a19;border:1px solid #1d5c5a;padding:4px 9px;cursor:pointer;color:#9fe8e4;font-size:11px}
.dock .app.open{border-color:#2fd6cf;color:#d6ff3a}.dock .app svg{width:15px;height:15px}
#tray{display:flex;gap:12px;align-items:center;color:#9fe8e4;font-size:11px}
#tray .v{color:#d6ff3a}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.2}}
</style><script src="../vendor/debug-cover.js?v=1.10.0"></script><script src="../vendor/top-bar.js?v=1.10.0"></script>
</head><body>
<div id="desk">
 <div class="deskicons" id="deskicons"></div>
</div>
<div id="bar">
 <div id="start"><svg viewBox="0 0 24 24" fill="none" stroke="#d6ff3a" stroke-width="2"><path d="M4 18c3-6 5-9 8-9s5 3 8 9"/><path d="M12 9V3"/><circle cx="12" cy="3" r="1.4" fill="#d6ff3a"/></svg>VERDANT</div>
 <div class="dock" id="dock"></div>
 <div id="tray"><span>SYS <span class="v">OK</span></span><span id="net">NET <span class="v">—</span></span><span id="clk"></span></div>
</div>

<script src="../vendor/offline-fetch.js"></script><script src="../vendor/data-states-10m.js"></script>
<script src="../vendor/leaflet/leaflet.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script>
const R=(a,b)=>a+Math.random()*(b-a);
/* ---------- icons ---------- */
const IC={
 radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12L20 7"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>',
 sensor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l4-6 4 4 4-9 6 11"/><path d="M3 21h18"/></svg>',
 crop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21V8"/><path d="M12 12c-4 0-5-3-5-5 3 0 5 1 5 5z"/><path d="M12 10c3 0 4-2 4-4-2 0-4 1-4 4z"/></svg>',
 status:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M8 4v16"/></svg>',
 log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 3h14v18H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 term:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>'
};

/* ---------- window manager ---------- */
let zTop=10; const WINS={};
function focusWin(w){zTop++;w.style.zIndex=zTop;document.querySelectorAll('.win').forEach(x=>x.classList.remove('active'));w.classList.add('active')}
function makeWin(app){
 if(WINS[app.id]){const w=WINS[app.id];w.style.display='flex';focusWin(w);markOpen();return w}
 const w=document.createElement('div');w.className='win active';w.style.left=app.x+'px';w.style.top=app.y+'px';w.style.width=app.w+'px';w.style.height=app.h+'px';
 w.innerHTML=`<div class="tb"><span class="ico" style="color:#2fd6cf">${IC[app.icon]}</span>${app.title}<span class="sp"></span><button data-a="min">_</button><button data-a="close">x</button></div><div class="wc">${app.html}</div>`;
 document.body.appendChild(w);WINS[app.id]=w;
 // drag
 const tb=w.querySelector('.tb');let dx,dy,drag=false;
 tb.addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;focusWin(w)});
 addEventListener('mousemove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-60,e.clientX-dx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-70,e.clientY-dy))+'px'});
 addEventListener('mouseup',()=>drag=false);
 w.addEventListener('mousedown',()=>focusWin(w));
 tb.querySelector('[data-a="min"]').onclick=()=>{w.style.display='none';markOpen()};
 tb.querySelector('[data-a="close"]').onclick=()=>{w.remove();delete WINS[app.id];markOpen()};
 focusWin(w);markOpen();
 if(app.onOpen)setTimeout(()=>app.onOpen(w),30);
 return w;
}
function markOpen(){document.querySelectorAll('#dock .app').forEach(a=>{const id=a.dataset.id;a.classList.toggle('open',!!WINS[id]&&WINS[id].style.display!=='none')})}

/* ---------- content builders ---------- */
function statusHTML(){return `<div class="pad"><div class="row">Radar link<span class="v" id="rl">ONLINE</span></div><div class="row">Soil probes<span class="v">48/50</span></div><div class="row">Irrigation<span class="v">STANDBY</span></div><div class="row">Silo vents<span class="v">SEALED</span></div><div class="row">Grid power<span class="v">NOMINAL</span></div><div class="haz"><span class="blink">DUST ADVISORY</span></div><div class="row">Blight index<span class="v">0.37 &#9650;</span></div></div>`}
function cropHTML(){return `<div class="pad">Corn<div class="bar"><i style="width:62%"></i></div>Wheat<div class="bar"><i style="width:41%"></i></div>Soybean<div class="bar"><i style="width:77%"></i></div>Sorghum<div class="bar"><i style="width:55%"></i></div>Alfalfa<div class="bar"><i style="width:68%"></i></div><div class="row">Avg canopy NDVI<span class="v">0.58</span></div><div class="row">Irrigated acres<span class="v">1,240</span></div></div>`}

/* ---------- live radar map (reused from mockup) ---------- */
function mapHTML(){return `<div class="maproot"><div class="flag" id="rflag">RADAR: INIT</div><div class="leaf" id="leaf"></div><div class="fb" id="fb"><canvas id="mc"></canvas><svg id="usmap" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet"><g id="states"></g><g id="labels"></g></svg></div><div class="attr" id="attr">init</div></div>`}
function initMap(){
 const flag=document.getElementById('rflag'),attr=document.getElementById('attr');
 function fb(reason){document.getElementById('leaf').style.display='none';document.getElementById('fb').style.display='block';flag.textContent='RADAR: OFFLINE (SVG)';flag.style.color='#ffb03a';attr.textContent='offline — '+reason;setNet('OFFLINE');buildFallback()}
 async function live(){
  if(typeof L==='undefined')throw new Error('leaflet');
  const map=L.map('leaf',{zoomControl:true,attributionControl:true}).setView([39.5,-98.5],5);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Basemap &copy; <a href="https://www.esri.com/">Esri</a>; &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  try{const topo=await (await fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')).json();const geo=topojson.feature(topo,topo.objects.states);map.createPane('b');map.getPane('b').classList.add('border-pane');map.getPane('b').style.zIndex=450;L.geoJSON(geo,{pane:'b',style:{color:'#2fd6cf',weight:1.1,fill:false,opacity:.85}}).addTo(map)}catch(e){}
  let radar=false;try{const meta=await (await fetch('https://api.rainviewer.com/public/weather-maps.json')).json();const fr=(meta.radar&&(meta.radar.past||[]).concat(meta.radar.nowcast||[]))||[];if(fr.length){const f=fr[fr.length-1];map.createPane('r');map.getPane('r').classList.add('radar-pane');map.getPane('r').style.zIndex=440;L.tileLayer(meta.host+f.path+'/256/{z}/{x}/{y}/8/1_1.png',{pane:'r',opacity:.75}).addTo(map);radar=true}}catch(e){}
  flag.textContent=radar?'RADAR: LIVE (RainViewer)':'RADAR: LIVE BASEMAP';flag.style.color='#d6ff3a';setNet('ONLINE');
  attr.innerHTML='&copy; Esri / OpenStreetMap · borders us-atlas · radar &copy; <a href="https://www.rainviewer.com/">RainViewer</a>';
  setTimeout(()=>map.invalidateSize(),250);
 }
 let done=false;const g=setTimeout(()=>{if(!done){done=true;fb('timeout')}},3500);
 (async()=>{try{await live();if(!done){done=true;clearTimeout(g)}}catch(e){if(!done){done=true;clearTimeout(g);fb(e.message)}}})();
}
function buildFallback(){
 const S=[{n:'S.DAKOTA',lx:230,ly:150,d:'M150,80 L470,80 L470,150 L500,150 L500,200 L150,200 Z'},{n:'NEBRASKA',lx:260,ly:255,d:'M150,200 L500,200 L540,235 L560,270 L300,270 L300,245 L150,245 Z'},{n:'IOWA',lx:600,ly:240,d:'M500,200 L650,210 L665,270 L560,270 L540,235 L500,200 Z'},{n:'COLORADO',lx:85,ly:300,d:'M20,245 L150,245 L150,370 L20,370 Z'},{n:'KANSAS',lx:300,ly:325,d:'M150,270 L560,270 L560,375 L150,375 Z'},{n:'MISSOURI',lx:620,ly:330,d:'M560,270 L665,270 L690,300 L700,370 L670,430 L640,430 L625,400 L560,400 Z'},{n:'OKLAHOMA',lx:320,ly:430,d:'M70,400 L150,400 L150,375 L560,375 L560,400 L625,400 L625,470 L220,470 L220,430 L70,430 Z'},{n:'MINNESOTA',lx:580,ly:140,d:'M470,80 L560,70 L640,120 L650,210 L500,200 L500,150 L470,150 Z'}];
 const sg=document.getElementById('states'),lg=document.getElementById('labels');if(!sg)return;
 S.forEach(s=>{sg.insertAdjacentHTML('beforeend',`<path class="st" d="${s.d}"/>`);lg.insertAdjacentHTML('beforeend',`<text class="stlbl" x="${s.lx}" y="${s.ly}">${s.n}</text>`)});
 let c='';for(let i=0;i<9;i++)c+=`<path class="cty" d="M20,${90+i*58} L700,${90+i*58}"/>`;for(let i=0;i<13;i++)c+=`<path class="cty" d="M${40+i*55},80 L${40+i*55},470"/>`;sg.insertAdjacentHTML('afterbegin',c);
 lg.insertAdjacentHTML('beforeend','<circle cx="330" cy="300" r="5" fill="#d6ff3a"/><text class="stlbl" x="342" y="304" fill="#d6ff3a">HOME FARM</text>');
 const mc=document.getElementById('mc'),cx=mc.getContext('2d');function fit(){mc.width=mc.clientWidth;mc.height=mc.clientHeight}fit();
 const blobs=[...Array(8)].map(()=>({x:R(.15,.85),y:R(.2,.7),r:R(26,70),dx:R(.0002,.0006)}));
 (function loop(){if(!document.body.contains(mc))return;const W=mc.width,H=mc.height;cx.fillStyle='#060a0b';cx.fillRect(0,0,W,H);blobs.forEach(b=>{b.x+=b.dx;if(b.x>1.05)b.x=.1;const g=cx.createRadialGradient(b.x*W,b.y*H,0,b.x*W,b.y*H,b.r*1.7);g.addColorStop(0,'rgba(214,255,58,.85)');g.addColorStop(.4,'rgba(214,255,58,.3)');g.addColorStop(.7,'rgba(47,214,207,.25)');g.addColorStop(1,'rgba(47,214,207,0)');cx.fillStyle=g;cx.beginPath();cx.arc(b.x*W,b.y*H,b.r*1.7,0,7);cx.fill()});requestAnimationFrame(loop)})();
}

/* ---------- sensor charts ---------- */
function chartsHTML(){return `<div class="charts" id="chwrap"></div>`}
function initCharts(){const names=['Humidity %','Wind km/h','Soil moisture','Dust index','Temp °C','PM10'];const wrap=document.getElementById('chwrap');const data=names.map(()=>[...Array(50)].map(()=>R(.2,.8)));
 names.forEach(n=>wrap.insertAdjacentHTML('beforeend',`<div class="cp"><div class="h">${n}</div><canvas></canvas></div>`));
 const cvs=[...wrap.querySelectorAll('canvas')];
 (function loop(){if(!document.body.contains(wrap))return;cvs.forEach((cv,i)=>{cv.width=cv.clientWidth;cv.height=cv.clientHeight;const x=cv.getContext('2d'),d=data[i];d.shift();d.push(Math.min(.95,Math.max(.05,d[d.length-1]+R(-.08,.08))));x.strokeStyle=i==3?'#d6ff3a':'#2fd6cf';x.lineWidth=1.4;x.beginPath();d.forEach((v,j)=>x.lineTo(j/(d.length-1)*cv.width,cv.height*(1-v)));x.stroke();x.fillStyle='#d6ff3a';x.fillText((d[d.length-1]*100).toFixed(0),cv.width-22,11)});setTimeout(loop,600)})();
}

/* ---------- event log ---------- */
function logHTML(){return `<div class="pad" id="evlog"></div>`}
function initLog(){const ev=['Dust front crossing county line 12','Probe S-31 low battery','Wind gust 71 km/h at NW mast','Irrigation pump 2 paused','Visibility < 2 km','Silo vent auto-closed','Radar sweep complete'];const el=document.getElementById('evlog');
 (function loop(){if(!document.body.contains(el))return;const d=new Date().toTimeString().slice(0,8);el.insertAdjacentHTML('afterbegin',`<div class="row">${d}<span class="v">${ev[Math.random()*ev.length|0]}</span></div>`);if(el.children.length>14)el.lastChild.remove();setTimeout(loop,1400)})()}

/* ---------- terminal ---------- */
function termHTML(){return `<div class="term" id="term"><div>VerdantOS shell v2.4 — type 'help'</div><div id="tout"></div><div class="in"><span>agri@verdant:~$</span><input id="tin" autofocus></div></div>`}
function initTerm(){const out=document.getElementById('tout'),inp=document.getElementById('tin');
 const cmds={help:()=>'commands: help, status, radar, crops, probes, ls, clear',status:()=>'radar ONLINE · 48/50 probes · dust advisory ACTIVE · blight 0.37',radar:()=>'NEXRAD link up · last sweep '+new Date().toTimeString().slice(0,8)+' · 3 dust cells tracked',crops:()=>'corn 62% wheat 41% soybean 77% sorghum 55% alfalfa 68%',probes:()=>'S-01..S-50 reporting; S-31 LOW BATT; mean soil moisture 0.34',ls:()=>'fields/  radar/  probes/  logs/  config.yml'};
 function run(c){c=c.trim();if(!c)return;if(c==='clear'){out.innerHTML='';return}const f=cmds[c];out.insertAdjacentHTML('beforeend',`<div><span style="color:#d6ff3a">agri@verdant:~$</span> ${c}</div><div>${f?f():'command not found: '+c}</div>`);out.scrollTop=1e6}
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){run(inp.value);inp.value=''}});
 document.getElementById('term').addEventListener('click',()=>inp.focus());
}

/* ---------- app registry ---------- */
const APPS=[
 {id:'radar',title:'Weather Radar',icon:'radar',x:300,y:70,w:720,h:460,html:mapHTML(),onOpen:initMap},
 {id:'sensor',title:'Field Sensors',icon:'sensor',x:1040,y:70,w:360,h:300,html:chartsHTML(),onOpen:initCharts},
 {id:'crop',title:'Crop Health',icon:'crop',x:300,y:548,w:300,h:250,html:cropHTML()},
 {id:'status',title:'System Status',icon:'status',x:620,y:548,w:300,h:250,html:statusHTML()},
 {id:'log',title:'Event Log',icon:'log',x:1040,y:390,w:360,h:260,html:logHTML(),onOpen:initLog},
 {id:'term',title:'Terminal',icon:'term',x:40,y:430,w:380,h:230,html:termHTML(),onOpen:initTerm}
];
const dock=document.getElementById('dock'),deskicons=document.getElementById('deskicons');
APPS.forEach(a=>{
 dock.insertAdjacentHTML('beforeend',`<div class="app" data-id="${a.id}"><span style="color:inherit">${IC[a.icon]}</span>${a.title}</div>`);
 deskicons.insertAdjacentHTML('beforeend',`<div class="di" data-id="${a.id}">${IC[a.icon]}<span>${a.title}</span></div>`);
});
document.querySelectorAll('#dock .app, .di').forEach(el=>el.addEventListener('click',()=>makeWin(APPS.find(a=>a.id===el.dataset.id))));
function setNet(s){document.getElementById('net').innerHTML='NET <span class="v">'+s+'</span>'}
setInterval(()=>document.getElementById('clk').textContent=new Date().toTimeString().slice(0,8),500);
// autostart a few windows
makeWin(APPS[0]);makeWin(APPS[3]);makeWin(APPS[1]);makeWin(APPS[5]);
</script><div id="ui-hint" style="position:fixed;right:8px;bottom:6px;z-index:9999;font:11px/1.3 inherit;font-family:inherit;color:#9fe39f;opacity:.55;pointer-events:none;letter-spacing:.04em">Terminal: type a command + Enter</div>
</body></html>
