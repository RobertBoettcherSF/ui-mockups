<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Secure Video Call</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#e8eef2;font:13px/1.4 -apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center}
/* top badge */
#badge{margin-top:14px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 38%,#1c3550,#0b1a2b 75%);border:2px solid #2d4968;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 18px #0e2a4788}
#badge svg{width:40px;height:40px}
#badge .bt{font-size:8px;letter-spacing:1px;color:#9fc0dc;margin-top:2px;font-weight:600}
/* video row */
#stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 10px}
.panel{position:relative;width:49%;max-width:720px;aspect-ratio:16/9;border:1.5px solid #e8eef2;background:#000;overflow:hidden}
.seal{position:absolute;inset:0;margin:auto;width:120px;height:120px;z-index:3}
.cap{position:absolute;left:10px;bottom:8px;z-index:4;font-size:11px;letter-spacing:1px;color:#dfe7ee;text-shadow:0 1px 3px #000;text-transform:uppercase}
/* left generated park/building scene */
#scene{position:absolute;inset:0;z-index:1}
#scene .sky{position:absolute;inset:0;background:linear-gradient(#5a7fa6,#9db9d4 55%,#c9d8e6 70%)}
#scene .sun{position:absolute;top:12%;left:66%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#fffbe8,#ffe9a800 70%)}
#scene .bldg{position:absolute;bottom:30%;left:4%;right:4%;height:34%;background:linear-gradient(#b9c4cf,#8795a3);box-shadow:inset 0 0 0 1px #6b7784}
#scene .bldg:before{content:"";position:absolute;inset:6px;background:repeating-linear-gradient(90deg,#7e8d9b 0 10px,#9dacbb 10px 20px),repeating-linear-gradient(0deg,#7e8d9b 0 12px,#aebccb 12px 24px);background-blend-mode:multiply;opacity:.6}
#scene .dome{position:absolute;bottom:62%;left:44%;width:70px;height:40px;background:#9aa8b6;border-radius:40px 40px 0 0}
#scene .lawn{position:absolute;bottom:0;left:0;right:0;height:34%;background:linear-gradient(#3f6b3a,#2c4f2a)}
#scene .tulips{position:absolute;bottom:0;left:0;right:0;height:16%;background:repeating-linear-gradient(90deg,#b5355a 0 7px,#8f2a46 7px 11px,#3f6b3a 11px 18px);opacity:.92}
#scene .tree{position:absolute;bottom:30%;width:26px;height:60px;background:#243d22;border-radius:50% 50% 40% 40%}
#scene .dim{position:absolute;inset:0;background:#02060acc}
/* right dark panel subtle */
#rightbg{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 45%,#0a1420,#000 70%)}
/* controls */
#ctrls{width:100%;height:120px;position:relative}
.cluster{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}
.cbtn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#2a2f36;color:#e8eef2;transition:background .15s,transform .1s}
.cbtn:hover{transform:translateY(-1px)}
.cbtn svg{width:20px;height:20px}
.cbtn.red{background:#d33a33}.cbtn.red:hover{background:#e04a42}
.cbtn.muted{background:#d33a33}
.recwrap{display:flex;align-items:center;gap:7px;background:#d33a33;color:#fff;border:none;cursor:pointer;height:46px;padding:0 16px;border-radius:24px;font-weight:600;letter-spacing:1px}
.recdot{width:10px;height:10px;border-radius:50%;background:#fff}
.recwrap.on .recdot{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:12px}
#sideL{left:30px}#sideR{right:30px}
.sbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:#2a2f36;color:#cfd8e0;display:flex;align-items:center;justify-content:center}
.sbtn:hover{background:#363c44}.sbtn svg{width:18px;height:18px}
.sbtn.blue{background:#2f6fd6;color:#fff}.sbtn.blue:hover{background:#3a7de6}
.sbtn.on{background:#2f6fd6;color:#fff}
#ended{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#ended h1{font-weight:400;letter-spacing:2px;color:#e8eef2}#ended p{color:#8b98a5}
#ended button{margin-top:10px;background:#2a2f36;color:#e8eef2;border:none;padding:10px 20px;border-radius:22px;cursor:pointer}
#rectime{position:absolute;right:30px;top:14px;color:#d33a33;font-weight:600;letter-spacing:1px;font-size:12px;display:none}
.panel.speaking{border:4px solid #36c06a;box-shadow:0 0 0 4px #36c06a,0 0 28px #36c06a,inset 0 0 40px #36c06a55;animation:spkPulse 1s ease-in-out infinite}
@keyframes spkPulse{50%{box-shadow:0 0 0 6px #5fe08c,0 0 40px #5fe08c,inset 0 0 50px #36c06a77}}
.spk{display:none;position:absolute;top:8px;left:10px;z-index:5;align-items:center;gap:6px;font-size:18px;font-weight:800;letter-spacing:2px;color:#fff;background:#1fa651;padding:6px 14px;border-radius:3px}
.spk i{width:12px;height:12px;border-radius:50%;background:#fff}
.panel.speaking .spk{display:flex}
</style><script src="../vendor/debug-cover.js?v=1.11.0"></script><script src="../vendor/top-bar.js?v=1.11.0"></script>
</head><body>
<!-- top-centre badge: abstract, flag-free -->
<div id="badge">
 <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="none" stroke="#6fa0cc" stroke-width="2"/><path d="M24 9l4.5 9.3 10.2 1.5-7.4 7.2 1.7 10.1L24 42l-9.2 4.8" fill="none"/><g stroke="#8fc0ec" stroke-width="2" fill="none"><polygon points="24,13 33,30 15,30"/><circle cx="24" cy="26" r="4"/></g></svg>
 <span class="bt">SECURE LINK</span>
</div>

<div id="stage">
 <!-- LEFT: remote office with generated park/building scene -->
 <div class="panel" id="pL"><div class="spk"><i></i>SPEAKING</div>
  <div id="scene">
   <div class="sky"></div><div class="sun"></div>
   <div class="bldg"></div><div class="dome"></div>
   <div class="tree" style="left:6%"></div><div class="tree" style="left:84%;height:70px"></div><div class="tree" style="left:30%;height:50px"></div>
   <div class="lawn"></div><div class="tulips"></div>
   <div class="dim"></div>
  </div>
  <svg class="seal" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#0e1b2a" stroke="#cfe0f0" stroke-width="2"/><circle cx="60" cy="60" r="42" fill="none" stroke="#9fc0dc" stroke-width="1"/><g stroke="#cfe0f0" stroke-width="2" fill="none"><polygon points="60,34 78,74 42,74"/><circle cx="60" cy="62" r="10"/><path d="M60 52v20M50 62h20"/></g><text x="60" y="20" fill="#cfe0f0" font-size="7" text-anchor="middle" font-family="Arial" letter-spacing="1">REMOTE OFFICE A</text><text x="60" y="106" fill="#9fc0dc" font-size="6" text-anchor="middle" font-family="Arial" letter-spacing="2">SECURE CHANNEL</text></svg>
  <div class="cap">Remote Office A — Harbourton</div>
 </div>
 <!-- RIGHT: executive office dark panel -->
 <div class="panel" id="pR"><div class="spk"><i></i>SPEAKING</div>
  <div id="rightbg"></div>
  <svg class="seal" viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" fill="#0a1017" stroke="#c9b67a" stroke-width="2"/><circle cx="60" cy="60" r="43" fill="none" stroke="#c9b67a" stroke-width="1"/><g stroke="#d8c98e" stroke-width="2" fill="none"><rect x="46" y="46" width="28" height="28" transform="rotate(45 60 60)"/><circle cx="60" cy="60" r="9"/><path d="M60 30v12M60 78v12M30 60h12M78 60h12"/></g><text x="60" y="19" fill="#d8c98e" font-size="6.5" text-anchor="middle" font-family="Arial" letter-spacing="1">EXECUTIVE OFFICE B</text><text x="60" y="107" fill="#c9b67a" font-size="6" text-anchor="middle" font-family="Arial" letter-spacing="2">OFFICE OF THE AIDE</text></svg>
  <div class="cap">Executive Office B — Chief of Staff Aide</div>
 </div>
</div>

<div id="ctrls">
 <div id="rectime">● REC 00:00</div>
 <div id="sideL" class="side">
  <button class="sbtn" id="fsBtn" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="sbtn" id="lockBtn" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
 </div>
 <div class="cluster">
  <button class="cbtn" id="micBtn" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
  <button class="cbtn red" id="hangBtn" title="Hang up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-2.5 0-4.9.4-7 1.2v3.3c0 .5.3 1 .8 1.1l2.4.6c.5.1 1-.1 1.2-.6l.8-2a16 16 0 015.6 0l.8 2c.2.5.7.7 1.2.6l2.4-.6c.5-.1.8-.6.8-1.1v-3.3C16.9 9.4 14.5 9 12 9z"/></svg></button>
  <button class="recwrap" id="recBtn" title="Record"><span class="recdot"></span>REC</button>
 </div>
 <div id="sideR" class="side">
  <button class="sbtn" id="camBtn" title="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="13" height="11" rx="2"/><path d="M16 11l5-3v9l-5-3z"/></svg></button>
  <button class="sbtn blue" id="shareBtn" title="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg></button>
 </div>
</div>

<div id="ended"><h1>Call ended</h1><p>Secure link terminated</p><button id="rejoin">Rejoin</button></div>

<script>
const $=id=>document.getElementById(id);
// mic mute toggle
let muted=false;
$('micBtn').onclick=()=>{muted=!muted;$('micBtn').classList.toggle('muted',muted);$('micBtn').title=muted?'Unmute':'Mute';$('micBtn').querySelector('svg').style.opacity=muted?'.5':'1'};
// REC timer
let rec=false,recStart=0,recIv=null;
function pad(n){return n.toString().padStart(2,'0')}
$('recBtn').onclick=()=>{rec=!rec;$('recBtn').classList.toggle('on',rec);const t=$('rectime');
 if(rec){recStart=Date.now();t.style.display='block';recIv=setInterval(()=>{const s=(Date.now()-recStart)/1000|0;t.textContent='● REC '+pad(s/60|0)+':'+pad(s%60)},250)}
 else{clearInterval(recIv);t.style.display='none'}};
// lock toggle
let locked=false;
$('lockBtn').onclick=()=>{locked=!locked;$('lockBtn').classList.toggle('on',locked);$('lockBtn').querySelector('svg').innerHTML=locked?'<rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V7a4 4 0 018 0"></path>':'<rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 018 0v3"></path>'};
// camera toggle
let cam=true;
$('camBtn').onclick=()=>{cam=!cam;$('camBtn').classList.toggle('on',!cam);$('pR').style.filter=cam?'none':'grayscale(1) brightness(.5)'};
// share toggle
$('shareBtn').onclick=()=>$('shareBtn').classList.toggle('on');
// fullscreen API
$('fsBtn').onclick=()=>{if(!document.fullscreenElement){(document.documentElement.requestFullscreen||(()=>{})).call(document.documentElement)}else{(document.exitFullscreen||(()=>{})).call(document)}};
// hang up
$('hangBtn').onclick=()=>{$('ended').style.display='flex';if(recIv)clearInterval(recIv)};
$('rejoin').onclick=()=>{$('ended').style.display='none';if(window.VoiceCover&&VoiceCover.restart)VoiceCover.restart()};
// voice drives the highlight: caller 0 = left panel, caller 1 = right panel
const panels=[$('pL'),$('pR')];
function hl(i){panels.forEach(p=>p.classList.remove('speaking'));if(i>=0&&panels[i])panels[i].classList.add('speaking');
 dispatchEvent(new CustomEvent('vc:highlight',{detail:{index:i,label:i>=0?panels[i].querySelector('.cap').textContent:null}}))}
addEventListener('vc:speaker',e=>hl(e.detail.index));
addEventListener('vc:ended',()=>{setTimeout(()=>{$('ended').style.display='flex';if(recIv)clearInterval(recIv)},800)});
</script><script src="../vendor/voice-cover.js?v=1.11.0" data-callers="2" data-langs="en,de,es,fr"></script>
</body></html>
