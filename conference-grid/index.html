<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Conference Grid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#e8eef2;font:13px/1.4 -apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center}
/* top building icon + timer */
#top{margin-top:12px;display:flex;flex-direction:column;align-items:center;z-index:5}
#top svg{width:62px;height:40px}
#timer{font-variant-numeric:tabular-nums;letter-spacing:2px;color:#e8eef2;margin-top:3px;font-size:15px}
/* grid */
#grid{flex:1;width:100%;max-width:1420px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;padding:10px 18px}
.tile{position:relative;background:#000;border:1.5px solid #e8eef2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tile .em{width:120px;height:120px}
.tile .cap{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.5px;color:#dfe7ee;text-shadow:0 1px 3px #000}
.tile.speaking{border-color:#36c06a;box-shadow:0 0 0 2px #36c06a,inset 0 0 26px #36c06a33}
.tile .spk{position:absolute;right:9px;top:8px;display:none;align-items:center;gap:4px;color:#36c06a;font-size:10px;letter-spacing:1px}
.tile.speaking .spk{display:flex}
.tile .spk i{width:6px;height:6px;border-radius:50%;background:#36c06a;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.2}}
/* controls (reused from secure-video-call) */
#ctrls{width:100%;height:110px;position:relative}
.cluster{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}
.cbtn{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#2a2f36;color:#e8eef2;transition:background .15s,transform .1s}
.cbtn:hover{transform:translateY(-1px)}.cbtn svg{width:20px;height:20px}
.cbtn.red{background:#d33a33}.cbtn.red:hover{background:#e04a42}.cbtn.muted{background:#d33a33}
.recwrap{display:flex;align-items:center;gap:7px;background:#d33a33;color:#fff;border:none;cursor:pointer;height:46px;padding:0 16px;border-radius:24px;font-weight:600;letter-spacing:1px}
.recdot{width:10px;height:10px;border-radius:50%;background:#fff}.recwrap.on .recdot{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.side{position:absolute;top:50%;transform:translateY(-50%);display:flex;gap:12px}#sideL{left:30px}#sideR{right:30px}
.sbtn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:#2a2f36;color:#cfd8e0;display:flex;align-items:center;justify-content:center}
.sbtn:hover{background:#363c44}.sbtn svg{width:18px;height:18px}
.sbtn.blue{background:#2f6fd6;color:#fff}.sbtn.blue:hover{background:#3a7de6}.sbtn.on{background:#2f6fd6;color:#fff}
#rectime{position:absolute;right:30px;top:12px;color:#d33a33;font-weight:600;letter-spacing:1px;font-size:12px;display:none}
#ended{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#ended h1{font-weight:400;letter-spacing:2px}#ended p{color:#8b98a5}
#ended button{margin-top:10px;background:#2a2f36;color:#e8eef2;border:none;padding:10px 20px;border-radius:22px;cursor:pointer}
</style><script src="../vendor/debug-cover.js?v=1.8.0"></script><script src="../vendor/top-bar.js?v=1.8.0"></script>
</head><body>
<div id="top">
 <!-- generic abstract building outline, resembles no real building -->
 <svg viewBox="0 0 62 40" fill="none" stroke="#e8eef2" stroke-width="1.6"><path d="M4 38h54M8 38V18M54 38V18M6 18l25-12 25 12z"/><path d="M15 38V20M23 38V20M31 38V20M39 38V20M47 38V20" stroke-width="2.4"/><circle cx="31" cy="3" r="1.6" fill="#e8eef2"/></svg>
 <div id="timer">00:00:00</div>
</div>

<div id="grid"></div>

<div id="ctrls">
 <div id="rectime">● REC 00:00</div>
 <div id="sideL" class="side">
  <button class="sbtn" id="fsBtn" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="sbtn" id="lockBtn" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>
 </div>
 <div class="cluster">
  <button class="cbtn" id="micBtn" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
  <button class="cbtn red" id="hangBtn" title="Hang up"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-2.5 0-4.9.4-7 1.2v3.3c0 .5.3 1 .8 1.1l2.4.6c.5.1 1-.1 1.2-.6l.8-2a16 16 0 015.6 0l.8 2c.2.5.7.7 1.2.6l2.4-.6c.5-.1.8-.6.8-1.1v-3.3C16.9 9.4 14.5 9 12 9z"/></svg></button>
  <button class="recwrap" id="recBtn" title="Record"><span class="recdot"></span>REC</button>
 </div>
 <div id="sideR" class="side">
  <button class="sbtn" id="camBtn" title="Camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="13" height="11" rx="2"/><path d="M16 11l5-3v9l-5-3z"/></svg></button>
  <button class="sbtn blue" id="shareBtn" title="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg></button>
 </div>
</div>

<div id="ended"><h1>Call ended</h1><p>Conference link terminated</p><button id="rejoin">Rejoin</button></div>

<script>
const $=id=>document.getElementById(id);
// six distinct original abstract emblems (no eagles/stars/flags/real logos)
const EM=[
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#0e1b2a" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><circle cx="60" cy="60" r="22"/><path d="M60 38v44M38 60h44"/></g></svg>`,
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#14100e" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><polygon points="60,30 86,75 34,75"/><polygon points="60,46 74,70 46,70"/></g></svg>`,
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#0a1613" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><rect x="42" y="42" width="36" height="36" transform="rotate(45 60 60)"/><circle cx="60" cy="60" r="10"/></g></svg>`,
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#120e18" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><circle cx="60" cy="60" r="26"/><circle cx="60" cy="60" r="14"/><path d="M60 20v16M60 84v16M20 60h16M84 60h16"/></g></svg>`,
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#0e1412" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><path d="M40 78V42l20 14 20-14v36"/><path d="M40 42l20 14 20-14"/></g></svg>`,
 c=>`<svg class="em" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#1a1222" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2.4" fill="none"><path d="M34 74c0-22 14-34 26-34s26 12 26 34"/><circle cx="60" cy="40" r="7"/><path d="M34 82h52"/></g></svg>`
];
const PART=[
 {cap:'Coordinator — Mara Venn',color:'#c9b67a'},
 {cap:'Regional Lead North — Tobias Ekker',color:'#6fa0cc'},
 {cap:'Regional Lead East — Ines Corral',color:'#8fd0b0'},
 {cap:'Regional Lead South — Dev Ashby',color:'#cfd8e0'},
 {cap:'Liaison Officer — Kai Brenner',color:'#d9a06a'},
 {cap:'Council Chair — Network Partners',color:'#b490d8'}
];
const grid=$('grid');
PART.forEach((p,i)=>{
 const t=document.createElement('div');t.className='tile';
 t.innerHTML=`${EM[i](p.color)}<div class="spk"><i></i>SPEAKING</div><div class="cap">${p.cap}</div>`;
 grid.appendChild(t);
});
const tiles=[...document.querySelectorAll('.tile')];
// active-speaker highlight cycling
let cur=0;
function hl(i){tiles.forEach(t=>t.classList.remove('speaking'));cur=i;if(i>=0&&tiles[i]){tiles[i].classList.add('speaking');}
 dispatchEvent(new CustomEvent('vc:highlight',{detail:{index:i,label:i>=0&&PART[i]?PART[i].cap:null}}));}
// voice drives the highlight: the tile whose caller is talking shows SPEAKING (only that one)
let voiceSpk=-1;addEventListener('vc:speaker',e=>{voiceSpk=e.detail.index;if(voiceSpk>=0)hl(voiceSpk);});
// idle: gentle random cycling only while no voice is playing
// once every line is spoken the call ends: no highlight, no idle hop, ended screen
let callOver=false;addEventListener('vc:ended',()=>{callOver=true;hl(-1);setTimeout(()=>{if(callOver)$('ended').style.display='flex'},1200)});
function cycle(){if(callOver||voiceSpk>=0||(window.speechSynthesis&&speechSynthesis.speaking))return;hl(Math.random()*tiles.length|0)}
cycle();setInterval(cycle,2600);

// call timer HH:MM:SS
const t0=Date.now();const pad=n=>n.toString().padStart(2,'0');
setInterval(()=>{const s=(Date.now()-t0)/1000|0;$('timer').textContent=pad(s/3600|0)+':'+pad((s/60|0)%60)+':'+pad(s%60)},250);

// controls
let muted=false;$('micBtn').onclick=()=>{muted=!muted;$('micBtn').classList.toggle('muted',muted);$('micBtn').title=muted?'Unmute':'Mute';$('micBtn').querySelector('svg').style.opacity=muted?'.5':'1'};
let recIv=null;$('recBtn').onclick=()=>{const on=$('recBtn').classList.toggle('on');const rt=$('rectime');if(on){const s0=Date.now();rt.style.display='block';recIv=setInterval(()=>{const s=(Date.now()-s0)/1000|0;rt.textContent='● REC '+pad(s/60|0)+':'+pad(s%60)},250)}else{clearInterval(recIv);rt.style.display='none'}};
let locked=false;$('lockBtn').onclick=()=>{locked=!locked;$('lockBtn').classList.toggle('on',locked);$('lockBtn').querySelector('svg').innerHTML=locked?'<rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V7a4 4 0 018 0"></path>':'<rect x="5" y="11" width="14" height="9" rx="1"></rect><path d="M8 11V8a4 4 0 018 0v3"></path>'};
let cam=true;$('camBtn').onclick=()=>{cam=!cam;$('camBtn').classList.toggle('on',!cam);grid.style.filter=cam?'none':'grayscale(1) brightness(.6)'};
$('shareBtn').onclick=()=>$('shareBtn').classList.toggle('on');
$('fsBtn').onclick=()=>{if(!document.fullscreenElement){(document.documentElement.requestFullscreen||(()=>{})).call(document.documentElement)}else{(document.exitFullscreen||(()=>{})).call(document)}};
$('hangBtn').onclick=()=>{callOver=true;hl(-1);if(window.speechSynthesis)speechSynthesis.cancel();$('ended').style.display='flex';if(recIv)clearInterval(recIv)};
$('rejoin').onclick=()=>{$('ended').style.display='none';callOver=false;if(window.VoiceCover&&VoiceCover.restart)VoiceCover.restart()};
</script><script src="../vendor/voice-cover.js?v=1.8.0" data-callers="6" data-langs="en,fr"></script>
</body></html>
