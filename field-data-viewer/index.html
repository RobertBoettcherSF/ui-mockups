<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Field Monitoring Service — Data Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#e8f0e8;font-family:"DejaVu Sans Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden}
#hdr{position:absolute;top:3.5vh;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1.4vw}
#hdr svg{width:6.5vw;height:6.5vw}
#hdr .t1{font-family:Georgia,serif;font-size:2.6vw;color:#f2f2f2;border-bottom:1px solid #aaa;padding-bottom:.4vh}
#hdr .t2{font-family:Georgia,serif;font-size:2.2vw;color:#ddd;padding-top:.4vh}
.panel{position:absolute;background:#050805;border-radius:6px;box-shadow:0 0 14px rgba(90,230,110,.15)}
.bar{background:#5fe07a;color:#041;font-weight:bold;text-align:center;font-size:1.55vw;padding:.9vh 0;border-radius:6px 6px 0 0;color:#031a06}
#ov{left:2.5vw;top:20.5vh;width:32vw}
#ov .body{padding:1.2vh 1vw 1.6vh;font-size:1.2vw;line-height:1.5}
#ch{left:1.3vw;top:47.5vh;width:47vw}
table{border-collapse:collapse;margin:1.4vh 1.1vw 2vh;width:calc(100% - 2.2vw)}
td,th{border:1px solid #6fdf82;color:#7cf08e;font-size:1.2vw;text-align:left;padding:.7vh .8vw;vertical-align:top;font-weight:bold}
tr.row{cursor:pointer}tr.row:hover td{background:#0c1f0f}
tr.sel td{background:#0f2a13}
tr.alert td{color:#ff2a2a}
#fv{left:51vw;top:26.5vh;width:46.5vw;height:54vh}
#fv canvas{display:block;margin:1.4vh auto;width:39vw;height:46vh;border:1px solid #222}
#fv .cap{position:absolute;bottom:2.4vh;left:6.6vw;font-size:.9vw;color:#cfe;background:rgba(0,0,0,.55);padding:.2vh .5vw}
#sb{position:absolute;left:0;right:0;bottom:0;height:7.5vh;background:#07090c;border-top:1px solid #1a2a3a;display:flex;align-items:center;padding:0 2vw;font-size:1.5vw;color:#cdd}
#home{width:2.9vw;height:2.9vw;border-radius:50%;background:#2a7ad6;display:flex;align-items:center;justify-content:center;margin-right:3vw;box-shadow:0 0 0 2px #9cc8ff}
#sb .ic{margin-left:auto;display:flex;gap:1.3vw;align-items:center}
#sb .ic svg{width:2vw;height:2vw}
#clk{margin-left:3vw;color:#7cf08e}
</style><script src="../vendor/debug-cover.js?v=1.11.0"></script><script src="../vendor/top-bar.js?v=1.11.0"></script>
</head><body>
<div id="hdr">
 <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#ddd" stroke-width="3"/><circle cx="50" cy="50" r="34" fill="none" stroke="#5fe07a" stroke-width="2"/><path d="M18 62 Q34 44 50 58 T82 52" fill="none" stroke="#ddd" stroke-width="4"/><path d="M22 72 Q38 58 52 68 T80 64" fill="none" stroke="#5fe07a" stroke-width="3"/><polygon points="50,16 56,32 44,32" fill="#ddd"/></svg>
 <div><div class="t1">Field Monitoring Service</div><div class="t2">Data Portal</div></div>
</div>
<div class="panel" id="ov"><div class="bar">DATA OVERVIEW</div><div class="body" id="ovb"></div></div>
<div class="panel" id="ch"><div class="bar">DATA CHART</div>
<table><thead><tr><th>SITE</th><th>TIME</th><th>NTU</th><th>Temp °C</th><th>Remarks</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="panel" id="fv"><div class="bar">FILE VIEWER</div><canvas id="img" width="780" height="520"></canvas><div class="cap" id="cap"></div></div>
<div id="sb"><div id="home"><svg viewBox="0 0 24 24" width="70%" height="70%"><path d="M3 12 12 4l9 8h-3v8h-5v-5h-2v5H6v-8z" fill="#fff"/></svg></div>
<span>Scale:&nbsp; 1 : 50 000 &nbsp;|&nbsp; Projection:&nbsp; WGS 84</span><span id="clk"></span>
<div class="ic">
<svg viewBox="0 0 24 24"><path d="M3 13l6 6L21 6" fill="none" stroke="#5fe07a" stroke-width="3"/></svg>
<svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="#5fe07a" stroke-width="2.5"/><path d="M14.5 14.5 21 21M7 10h6M10 7v6" stroke="#5fe07a" stroke-width="2.5"/></svg>
<svg viewBox="0 0 24 24"><path d="M3 4h18v12H9l-5 4v-4H3z" fill="#5fe07a"/><path d="M12 7v6M9 10h6" stroke="#000" stroke-width="2"/></svg>
<svg viewBox="0 0 24 24"><path d="M3 18l5-9 4 5 3-4 6 8z" fill="#5fe07a"/><circle cx="17" cy="6" r="2" fill="#5fe07a"/></svg>
</div></div>
<script>
const rows=[
 {s:'SP-01',t:'04:58',n:'2.1',c:'11.4',r:'Normal',note:'Clear flow, no change from baseline'},
 {s:'SP-02',t:'05:03',n:'3.4',c:'11.9',r:'Within range',note:'Minor sediment after overnight rain'},
 {s:'SP-03',t:'05:08',n:'5.8',c:'12.6',r:'Slightly elevated',note:'Recheck scheduled at next pass'},
 {s:'SP-04',t:'05:12',n:'14.2',c:'13.8',r:'Above threshold',note:'Sample flagged for lab review',a:1}];
const tb=document.getElementById('tb');let sel=3;
rows.forEach((r,i)=>{const tr=document.createElement('tr');tr.className='row'+(r.a?' alert':'');
 tr.innerHTML=`<td>${r.s}</td><td>${r.t}</td><td>${r.n}</td><td>${r.c}</td><td>${r.r}</td>`;tr.onclick=()=>select(i);tb.appendChild(tr)});
tb.insertAdjacentHTML('beforeend','<tr><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr>');
function select(i){sel=i;[...tb.querySelectorAll('tr.row')].forEach((e,j)=>e.classList.toggle('sel',j===i));const r=rows[i];
 document.getElementById('ovb').innerHTML=`Site: ${r.s}<br>Time: ${r.t} LT<br>Turbidity: ${r.n} NTU<br>Water temp: ${r.c} °C<br>Notes: ${r.note}`;
 document.getElementById('cap').textContent=`IMG_${r.s.replace('-','')}_${r.t.replace(':','')}.jpg — aerial sample`;draw(i)}
// procedural aerial field image
function rnd(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
function draw(k){const c=document.getElementById('img'),x=c.getContext('2d'),W=c.width,H=c.height,R=rnd(1234+k*7);
 const cols=['#6f7f3a','#8a8f45','#a39a52','#5d7034','#7a6a3e','#93a356','#b0a265'];
 x.save();x.translate(W/2,H/2);x.rotate(-.35);for(let gx=-W;gx<W;gx+=110)for(let gy=-H;gy<H;gy+=90){x.fillStyle=cols[Math.floor(R()*cols.length)];x.fillRect(gx,gy,108,88);
  x.strokeStyle='rgba(0,0,0,.12)';for(let l=4;l<88;l+=6){x.beginPath();x.moveTo(gx,gy+l);x.lineTo(gx+108,gy+l);x.stroke()}}x.restore();
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3f6f86');g.addColorStop(1,'#5a8fa3');
 x.fillStyle=g;x.beginPath();x.moveTo(0,H*.62);x.bezierCurveTo(W*.3,H*.5,W*.55,H*.7,W,H*.38);x.lineTo(W,H*.52);x.bezierCurveTo(W*.55,H*.84,W*.3,H*.64,0,H*.76);x.fill();
 x.fillStyle='rgba(40,70,30,.8)';for(let i=0;i<70;i++){const t=R(),px=t*W,py=H*.6-H*.24*t+(R()-.5)*30-14;x.beginPath();x.arc(px,py,4+R()*6,0,7);x.fill()}
 x.strokeStyle='#cfc7b0';x.lineWidth=5;x.beginPath();x.moveTo(W*.18,0);x.lineTo(W*.33,H);x.stroke();
 const n=+rows[k].n;x.fillStyle=`rgba(${120+n*6},${110},60,${Math.min(.5,n/30)})`;x.beginPath();x.arc(W*.62,H*.55,40+n*3,0,7);x.fill();
 x.strokeStyle=rows[k].a?'#ff3030':'#5fe07a';x.lineWidth=3;x.strokeRect(W*.62-50,H*.55-50,100,100);
 x.fillStyle=x.strokeStyle;x.font='bold 20px sans-serif';x.fillText(rows[k].s,W*.62-50,H*.55-58)}
select(sel);
const clk=document.getElementById('clk');function tick(){clk.textContent=new Date().toTimeString().slice(0,8)+' LT'}tick();setInterval(tick,1000);
</script></body></html>
