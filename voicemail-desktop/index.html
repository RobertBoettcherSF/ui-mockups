<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Voicemail Desktop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.4 -apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;background:#0a1a2a;color:#15202b;user-select:none}
/* wallpaper scene */
#scene{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(160deg,#ff8a3d,#f26a21)}
/* voicemail window */
#vm{position:absolute;left:24px;bottom:58px;width:340px;background:#eef2f6;border:1px solid #c3ccd6;border-radius:6px;box-shadow:0 14px 50px #0008;z-index:20;overflow:hidden}
#vm .tb{height:26px;background:linear-gradient(#f6f8fb,#dde4ec);border-bottom:1px solid #c3ccd6;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:move;color:#44525f;font-size:11px}
#vm .tb svg{width:13px;height:13px}
#vm .tb .sp{flex:1}
#vm .tb button{width:16px;height:14px;border:1px solid #b9c3cd;background:#e7edf3;color:#56626e;font:9px monospace;cursor:pointer;line-height:1;border-radius:2px}
#vm .tb button:hover{background:#d2dae2}
#vm .body{padding:12px 14px;position:relative}
.hdr{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2f7fe0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar svg{width:16px;height:16px}
.who{flex:1}.who .nm{font-weight:700;color:#1d2a36;letter-spacing:.3px}.who .no{color:#6a7682;font-size:11px}
.meta{text-align:right;color:#6a7682;font-size:11px;white-space:nowrap}
.playrow{display:flex;align-items:center;justify-content:center;margin:14px 0 8px;position:relative;height:96px}
#wave{position:absolute;inset:0;width:100%;height:100%;opacity:.28}
.playbtn{width:76px;height:76px;position:relative;cursor:pointer;z-index:2}
.playbtn svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.playbtn .knob{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#4a97f0,#1f6fd6);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #1f6fd680}
.playbtn .knob svg{width:28px;height:28px;fill:#fff}
.times{display:flex;justify-content:space-between;color:#6a7682;font-size:11px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;border:1px solid #c3ccd6;background:#f8fafc;border-radius:5px;padding:7px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:#2b3742}
.acts button:hover{background:#edf1f6}
.acts button svg{width:14px;height:14px}
.acts .del{color:#c6342c}.acts .del svg{stroke:#c6342c}
#moreMenu{position:absolute;right:12px;bottom:46px;background:#fff;border:1px solid #c3ccd6;border-radius:5px;box-shadow:0 10px 30px #0004;display:none;z-index:5;overflow:hidden}
#moreMenu div{padding:8px 16px;cursor:pointer;font-size:12px;color:#2b3742}#moreMenu div:hover{background:#eef3f8}
#callState{display:none;align-items:center;gap:8px;margin-top:12px;color:#1f6fd6;font-weight:600;justify-content:center}
#callState .dot{width:8px;height:8px;border-radius:50%;background:#1f6fd6;animation:cpulse 1s steps(2) infinite}
@keyframes cpulse{50%{opacity:.2}}
/* toast */
#toast{position:absolute;left:24px;bottom:58px;background:#1d2a36;color:#eef2f6;padding:10px 16px;border-radius:6px;box-shadow:0 10px 30px #0006;z-index:40;display:none;font-size:12px}
/* taskbar */
#bar{position:absolute;left:0;right:0;bottom:0;height:40px;background:#000;display:flex;align-items:center;color:#e8eef2;z-index:30;font-size:13px}
.menus{display:flex;gap:4px;padding-left:16px}
.menu{position:relative}
.menu>.lbl{padding:8px 14px;cursor:pointer}.menu>.lbl:hover{background:#1c1c1c}
.menu .dd{position:absolute;bottom:40px;left:0;background:#0d0d0d;border:1px solid #2a2a2a;min-width:150px;display:none}
.menu.open .dd{display:block}
.menu .dd div{padding:8px 14px;cursor:pointer;color:#cfd8e0}.menu .dd div:hover{background:#1f6fd6;color:#fff}
#clock{position:absolute;left:50%;transform:translateX(-50%);font-variant-numeric:tabular-nums;letter-spacing:.5px}
#tray{margin-left:auto;display:flex;gap:16px;align-items:center;padding-right:16px}
#tray svg{width:17px;height:17px;cursor:pointer}
</style><script src="../vendor/debug-cover.js?v=1.10.0"></script><script src="../vendor/top-bar.js?v=1.10.0"></script>
</head><body>
<div id="scene"></div>

<!-- Voicemail window -->
<div id="vm">
 <div class="tb" id="vmtb"><svg viewBox="0 0 24 24" fill="none" stroke="#56626e" stroke-width="2"><path d="M4 7a3 3 0 013-3h2l2 4-2 2a12 12 0 006 6l2-2 4 2v2a3 3 0 01-3 3A17 17 0 014 7z"/></svg>Voicemail<span class="sp"></span><button id="vmMin">_</button><button id="vmClose">×</button></div>
 <div class="body">
  <div class="hdr">
   <div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg></div>
   <div class="who"><div class="nm">Health Agency Director</div><div class="no">+1 555-0100</div></div>
   <div class="meta">5:47 PM<br>0:42</div>
  </div>
  <div class="playrow">
   <svg id="wave" viewBox="0 0 320 96" preserveAspectRatio="none"></svg>
   <div class="playbtn" id="playBtn">
    <svg class="ring" viewBox="0 0 76 76"><circle cx="38" cy="38" r="34" fill="none" stroke="#cdd8e2" stroke-width="4"/><circle id="prog" cx="38" cy="38" r="34" fill="none" stroke="#1f6fd6" stroke-width="4" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6"/></svg>
    <div class="knob"><svg id="pIcon" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg></div>
   </div>
  </div>
  <div class="times"><span id="cur">0:00</span><span>0:42</span></div>
  <div id="callState"><span class="dot"></span><span id="callTxt">Calling…</span></div>
  <div class="acts">
   <button id="callBack"><svg viewBox="0 0 24 24" fill="none" stroke="#2b3742" stroke-width="2"><path d="M4 7a3 3 0 013-3h2l2 4-2 2a12 12 0 006 6l2-2 4 2v2a3 3 0 01-3 3A17 17 0 014 7z"/></svg>Call Back</button>
   <button class="del" id="delBtn"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Delete</button>
   <button id="moreBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#2b3742" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</button>
  </div>
  <div id="moreMenu"><div data-a="Transcript">Transcript</div><div data-a="Save">Save</div><div data-a="Forward">Forward</div></div>
 </div>
</div>
<div id="toast"></div>

<!-- taskbar -->
<div id="bar">
 <div class="menus">
  <div class="menu" data-m><div class="lbl">Channel</div><div class="dd"><div>Secure 1</div><div>Secure 2</div><div>Open Line</div><div>Relay</div></div></div>
  <div class="menu" data-m><div class="lbl">Comms</div><div class="dd"><div>Voicemail</div><div>Messages</div><div>Conference</div><div>Broadcast</div></div></div>
  <div class="menu" data-m><div class="lbl">Priority</div><div class="dd"><div>Routine</div><div>Elevated</div><div>Urgent</div><div>Critical</div></div></div>
 </div>
 <div id="clock">—</div>
 <div id="tray">
  <svg viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 010 6"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2"><path d="M2 8.5a16 16 0 0120 0M5 12a11 11 0 0114 0M8.5 15.5a6 6 0 007 0"/><circle cx="12" cy="19" r="1" fill="#e8eef2"/></svg>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const DUR=42;const CIRC=2*Math.PI*34;
// waveform
let wv='';for(let i=0;i<80;i++){const x=i/79*320;const h=10+Math.abs(Math.sin(i*0.6)*Math.cos(i*0.2))*70*Math.random();wv+=`<rect x="${x}" y="${(96-h)/2}" width="2.2" height="${h}" fill="#1f6fd6"/>`}
$('wave').innerHTML=wv;
// play/pause with progress ring over 42s
let playing=false,t=0,iv=null;
function fmt(s){return (s/60|0)+':'+Math.floor(s%60).toString().padStart(2,'0')}
function render(){$('prog').style.strokeDashoffset=CIRC*(1-t/DUR);$('cur').textContent=fmt(t)}
function setIcon(){$('pIcon').innerHTML=playing?'<rect x="7" y="5" width="3.6" height="14" rx="1"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1"></rect>':'<path d="M8 5l12 7-12 7z"></path>'}
$('playBtn').onclick=()=>{playing=!playing;setIcon();if(playing){const start=Date.now()-t*1000;iv=setInterval(()=>{t=(Date.now()-start)/1000;if(t>=DUR){t=DUR;render();clearInterval(iv);playing=false;setIcon();return}render()},100)}else clearInterval(iv)};
setIcon();render();
// delete -> toast dismiss
$('delBtn').onclick=()=>{$('vm').style.display='none';toast('Voicemail deleted');};
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600)}
// call back -> calling state
$('callBack').onclick=()=>{const cs=$('callState');cs.style.display='flex';$('callTxt').textContent='Calling Health Agency Director…';clearTimeout(cs._t);cs._t=setTimeout(()=>{$('callTxt').textContent='Connected';setTimeout(()=>cs.style.display='none',1800)},2500)};
// more menu
$('moreBtn').onclick=e=>{e.stopPropagation();const m=$('moreMenu');m.style.display=m.style.display==='block'?'none':'block'};
$('moreMenu').querySelectorAll('div').forEach(d=>d.onclick=()=>{$('moreMenu').style.display='none';toast(d.dataset.a+' selected')});
document.addEventListener('click',()=>{$('moreMenu').style.display='none'});
// window controls
$('vmClose').onclick=()=>$('vm').style.display='none';
$('vmMin').onclick=()=>{$('vm').style.display='none';toast('Voicemail minimised')};
// draggable
(function(){const w=$('vm'),tb=$('vmtb');let dx,dy,drag=false;
 tb.addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')return;drag=true;const r=w.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;w.style.bottom='auto';w.style.top=r.top+'px'});
 addEventListener('mousemove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-dx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-60,e.clientY-dy))+'px'});
 addEventListener('mouseup',()=>drag=false);
})();
// taskbar menus
document.querySelectorAll('.menu').forEach(m=>m.querySelector('.lbl').addEventListener('click',e=>{e.stopPropagation();const open=m.classList.contains('open');document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));if(!open)m.classList.add('open')}));
document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(x=>x.classList.remove('open')));
document.querySelectorAll('.menu .dd div').forEach(d=>d.onclick=()=>toast(d.textContent+' selected'));
// live day + time clock
const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
setInterval(()=>{const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=days[d.getDay()]+' '+h+':'+m.toString().padStart(2,'0')+' '+ap},1000);
(function(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const ap=h>=12?'PM':'AM';h=h%12||12;$('clock').textContent=days[d.getDay()]+' '+h+':'+m.toString().padStart(2,'0')+' '+ap})();
</script></body></html>
